server {
    listen 80;
    server_name _;

    # Serve static React build
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to backend (adjust backend upstream via env or replace here)
    # For containerized deployments, set BACKEND_HOST to the backend service name in your docker-compose or k8s.
    set $backend http://backend:5000;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }

    # Basic security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
}
